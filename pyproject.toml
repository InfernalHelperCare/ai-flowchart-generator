[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-flowchart-generator"
version = "0.6.3"
description = "AI-driven flowchart generator: natural-language specs, code, and notes to Mermaid / Graphviz / SVG / PNG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-flowchart-generator contributors" }]
keywords = ["flowchart", "diagram", "mermaid", "graphviz", "llm", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Presentation",
  "Topic :: Software Development :: Documentation",
]

dependencies = [
  "pydantic>=2.7,<3",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
render = ["graphviz>=0.20", "cairosvg>=2.7"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "pre-commit>=3.7",
]

[project.scripts]
aiflow = "ai_flowchart_generator.cli:main"
aiflow-gui = "ai_flowchart_generator.desktop.app:run"

[project.entry-points."ai_flowchart_generator.plugins"]
mermaid = "ai_flowchart_generator.renderers.mermaid:MermaidRenderer"
graphviz = "ai_flowchart_generator.renderers.graphviz:GraphvizRenderer"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_flowchart_generator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ai_flowchart_generator/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"